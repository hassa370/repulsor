<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Repulsor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #120c14; overflow: hidden; font-family: system-ui, sans-serif; color: #f4e9dc; }
      canvas { display: block; }
      #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(ellipse at 50% 70%, rgba(255,140,60,.35), rgba(18,12,20,.92) 60%); text-align: center; padding: 16px; box-sizing: border-box; }
      #overlay.hidden { display: none; }
      h1 { margin: 0; font-size: clamp(40px, 9vw, 84px); letter-spacing: .12em; font-weight: 800; color: #ffcf8a; text-shadow: 0 0 24px rgba(255,120,40,.7); }
      p { margin: 0; max-width: 560px; opacity: .85; line-height: 1.45; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      button { font: inherit; font-weight: 700; font-size: 18px; padding: 14px 26px; border-radius: 10px; border: 2px solid #ffb35c; background: #2a1a18; color: #ffe2b8; cursor: pointer; }
      button.primary { background: #ff8f3a; color: #1a0e08; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      #status { font-size: 14px; opacity: .7; min-height: 1.2em; }
      #keys { font-size: 13px; opacity: .65; }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>REPULSOR</h1>
      <p>Fly over a sunset city and blast waves of Log Goons.</p>
      <div class="row">
        <button id="enter-vr" class="primary" disabled>Loading…</button>
        <button id="play-desktop" disabled>Play on desktop</button>
      </div>
      <div id="status"></div>
      <div id="keys">Desktop: mouse look · Space thrust · Q hover · WASD steer · Shift boost · LMB/RMB fire (hold = charge) · E unibeam · Z/C snap turn · V vignette · Tab menu</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
